# Render Blueprint: Render → New → Blueprint → pick this repo.
# Deploys are triggered by GitHub Actions (.github/workflows/deploy.yml) through a deploy hook,
# only after the tests pass, so Render's own auto-deploy is turned off here.
services:
  - type: web
    name: farescope
    runtime: node
    plan: free
    region: singapore
    # Installs build tools too (Vite, Tailwind, TypeScript), builds the React app into dist/,
    # and records the commit so /healthz can report which version is live.
    buildCommand: npm ci --include=dev && npm run build && (git rev-parse --short HEAD > .build-commit || true)
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Fail the health check (so Render keeps the old version) if the web app wasn't built.
      - key: REQUIRE_WEB
        value: "1"
      # Secrets: Render asks for these when you create the Blueprint. Never commit them.
      - key: SERPAPI_KEY
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: TRAVELPAYOUTS_TOKEN
        sync: false
      # The free plan's disk is wiped on every deploy/restart, so this budget counter resets then too.
      # SerpApi's own free-plan cap (250/month) still applies.
      - key: SERPAPI_MONTHLY_LIMIT
        value: "250"
      - key: SERPAPI_HOURLY_LIMIT
        value: "30"
      - key: LIVE_CACHE_MINUTES
        value: "360"
